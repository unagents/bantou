# 202 用: PostgreSQL（pgvector 入り）と Ollama。memory 本体は含めない（systemd user unit で起動。README 参照）
# 起動: cd packages/memory/deploy && cp env.example .env && （.env の値を埋める）&& docker compose up -d
services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: memory-postgres
    restart: unless-stopped
    environment:
      # 注意: この POSTGRES_USER は superuser。migration 専用で、memory 本体の MEMORY_DATABASE_URL には使わない（RLS が効かず、起動時に拒否される）
      POSTGRES_USER: memory_owner
      POSTGRES_PASSWORD: ${MEMORY_PG_OWNER_PASSWORD:?set in .env}
      POSTGRES_DB: memory
    ports:
      - "127.0.0.1:${MEMORY_PG_PORT:-5433}:5432"
    volumes:
      - memory-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U memory_owner -d memory"]
      interval: 10s
      timeout: 5s
      retries: 6

  ollama:
    image: ollama/ollama:0.40.16
    container_name: memory-ollama
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 15s
      timeout: 10s
      retries: 5
    ports:
      - "127.0.0.1:${MEMORY_OLLAMA_PORT:-11435}:11434"
    volumes:
      - memory-ollama:/root/.ollama

volumes:
  memory-pgdata:
  memory-ollama:
