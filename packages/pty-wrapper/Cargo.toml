[package]
name = "bantou-pty-wrapper"
version = "0.1.0"
edition = "2021"
description = "pty wrapper for bantou master-cap sessions (newline-delimited JSON over stdin/stdout)"
publish = false

[[bin]]
name = "bantou-pty-wrapper"
path = "src/main.rs"

[dependencies]
portable-pty = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
opt-level = "s"
lto = true
strip = true

[lib]
name = "bantou_pty_wrapper"
path = "src/lib.rs"
