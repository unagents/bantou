[package]
name = "bantou-server"
version = "0.1.0"
description = "Remote-side orchestration daemon for bantou"
authors = ["grrow"]
edition = "2021"

[lib]
name = "bantou_server"

[dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
tokio = { version = "=1.52.3", features = ["rt", "macros", "signal"] }
toml = "=1.1.8"
log = "=0.4.34"
env_logger = "=0.11.11"

[dev-dependencies]
tempfile = "=3.27.0"
